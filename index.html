<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030207">
<title>Для тебя, Маша ♡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020206}
body{font-family:Georgia,"Times New Roman",serif}
#app{position:relative;width:100%;height:100svh;overflow:hidden;background:#020206}
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.25s cubic-bezier(.2,.7,.2,1),filter 1.25s,transform 1.25s;filter:blur(4px);transform:scale(1.035)}
.frame.active{opacity:1;visibility:visible;filter:none;transform:scale(1)}
.frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.frame.active img{animation:ken 8s ease-in-out both}
@keyframes ken{0%{transform:scale(1.025)}100%{transform:scale(1.075)}}

#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.vignette{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.36) 100%)}
.glow{position:absolute;z-index:11;left:50%;top:43%;width:75vw;height:75vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,92,164,.11),transparent 67%);filter:blur(16px);pointer-events:none;transition:opacity 1s}
.hotspot{position:absolute;z-index:30;border:0;background:transparent;padding:0;cursor:pointer}
#openHotspot{left:31%;width:38%;top:75%;height:12%}
#readHotspot{left:28%;width:44%;top:73%;height:14%}
#closeHotspot{left:37%;width:26%;bottom:3%;height:13%}
#nextHotspot{inset:0}

.particle{position:absolute;bottom:-30px;color:#ff9bc5;text-shadow:0 0 14px #ff4e9a;opacity:0;animation:rise var(--d) linear forwards}
@keyframes rise{
0%{opacity:0;transform:translate3d(0,0,0) scale(.65) rotate(0)}
12%{opacity:.78}90%{opacity:.15}
100%{opacity:0;transform:translate3d(var(--x),-115vh,0) scale(1.3) rotate(var(--r))}
}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd5e6;box-shadow:0 0 10px #ff78b5;animation:spark .9s ease-out forwards}
@keyframes spark{to{opacity:0;transform:translate(var(--x),var(--y)) scale(3)}}

.tap{
position:absolute;z-index:31;left:50%;bottom:16px;transform:translateX(-50%);
color:rgba(255,210,229,.75);font-size:11px;letter-spacing:1.5px;
opacity:0;animation:hint 2s 3s infinite;
pointer-events:none;text-align:center
}
@keyframes hint{0%,100%{opacity:0;transform:translate(-50%,3px)}50%{opacity:.8;transform:translate(-50%,0)}}

@media(max-width:390px){
 #openHotspot{top:74%;height:14%}
 #readHotspot{top:72%;height:16%}
}
@media(prefers-reduced-motion:reduce){
 .frame,.frame img{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="frame active" id="f0"><img src="01_intro.jpg" alt=""></div>
  <div class="frame" id="f1"><img src="02_envelope.jpg" alt=""></div>
  <div class="frame" id="f2"><img src="03_opening.jpg" alt=""></div>
  <div class="frame" id="f3"><img src="04_letter.jpg" alt=""></div>
  <div class="frame" id="f4"><img src="05_after_letter.jpg" alt=""></div>
  <div class="frame" id="f5"><img src="06_goodnight.jpg" alt=""></div>
  <div class="frame" id="f6"><img src="07_final.jpg" alt=""></div>

  <div class="vignette"></div><div class="glow"></div><div id="fx"></div>

  <button class="hotspot" id="openHotspot" aria-label="Открыть письмо"></button>
  <button class="hotspot" id="readHotspot" aria-label="Прочитать письмо"></button>
  <button class="hotspot" id="closeHotspot" aria-label="Закрыть письмо"></button>
  <button class="hotspot" id="nextHotspot" aria-label="Продолжить"></button>
  <div class="tap">нажми, чтобы продолжить</div>
</div>

<script>
const frames=[...document.querySelectorAll('.frame')];
const openHotspot=document.getElementById('openHotspot');
const readHotspot=document.getElementById('readHotspot');
const closeHotspot=document.getElementById('closeHotspot');
const nextHotspot=document.getElementById('nextHotspot');
const tap=document.querySelector('.tap');
let step=0;

function show(n){
  step=n;
  frames.forEach((f,i)=>f.classList.toggle('active',i===n));
  tap.style.display = (n===0 || n===6) ? 'block' : 'none';
  burst();
}

function burst(){
  for(let i=0;i<24;i++){
    const s=document.createElement('i');
    s.className='spark';
    s.style.left=innerWidth/2+'px';
    s.style.top=innerHeight/2+'px';
    const a=Math.random()*Math.PI*2;
    const d=40+Math.random()*170;
    s.style.setProperty('--x',Math.cos(a)*d+'px');
    s.style.setProperty('--y',Math.sin(a)*d+'px');
    document.getElementById('fx').appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }
}

/* заставка -> конверт */
setTimeout(()=>{if(step===0)show(1)},5200);

/* Тап по кнопке из референса */
openHotspot.onclick=()=>{
  if(step!==1)return;
  show(2);
  setTimeout(()=>show(3),1250);
};

/* На сцене с открытым письмом читаем письмо */
readHotspot.onclick=()=>{
  if(step===2){show(3)}
};

/* Закрываем письмо */
closeHotspot.onclick=()=>{
  if(step!==3)return;
  show(4);
  setTimeout(()=>show(5),1500);
  setTimeout(()=>show(6),3900);
};

/* Финал можно перелистнуть повторным тапом */
nextHotspot.onclick=()=>{
  if(step===0){show(1);return}
  if(step===5){show(6);return}
  if(step===6){show(0);return}
};

/* Лёгкие плавающие сердечки поверх фотографии */
setInterval(()=>{
  if(document.hidden)return;
  const e=document.createElement('i');
  e.className='particle';
  e.textContent=Math.random()<.25?'♡':'♥';
  e.style.left=Math.random()*100+'%';
  e.style.fontSize=9+Math.random()*17+'px';
  e.style.setProperty('--d',7+Math.random()*8+'s');
  e.style.setProperty('--x',(-90+Math.random()*180)+'px');
  e.style.setProperty('--r',(-50+Math.random()*100)+'deg');
  document.getElementById('fx').appendChild(e);
  setTimeout(()=>e.remove(),16000);
},850);

/* Свайп вверх */
let sy=0;
addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dy)<55)return;
  if(dy<0 && (step===0||step===5)){show(step===0?1:6)}
});

/* Небольшая реакция на движение телефона */
if(window.DeviceOrientationEvent){
 addEventListener('deviceorientation',e=>{
   const x=Math.max(-10,Math.min(10,e.gamma||0));
   const y=Math.max(-10,Math.min(10,(e.beta||0)-45));
   document.querySelector('.glow').style.transform=
    `translate(calc(-50% + ${x}px),calc(-50% + ${y*.25}px))`;
 });
}
</script>
</body>
</html>
